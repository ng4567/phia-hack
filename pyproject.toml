[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phia-hack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
dev = "app.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = [
    "src/backend/style-me",
]
