[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phia-hack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "requests>=2.33.1",
    "fal-client>=0.7.0",
    "agent-framework==1.0.0rc6",
    "azure-ai-projects>=2.0.1",
    "pydantic>=2.13.2",
    "tavily-python>=0.7.23",
    "azure-identity>=1.26.0b2",
]

[project.scripts]
dev = "app.main:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.workspace]
members = [
    "src/backend/style-me",
]
