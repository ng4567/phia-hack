<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Style-Me · Virtual Try-On</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0 auto;
      padding: 2rem;
      max-width: 1100px;
      background: #fafafa;
      color: #111;
    }
    h1 { margin-top: 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    .card {
      background: #fff; border: 1px solid #e5e5e5; border-radius: 12px;
      padding: 1.25rem; box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }
    label { display: block; font-weight: 600; margin-bottom: .5rem; }
    input[type=file] { width: 100%; }
    .preview {
      margin-top: .75rem; width: 100%; aspect-ratio: 3/4;
      border-radius: 8px; border: 1px dashed #ccc;
      background: #f3f3f3 center/contain no-repeat;
      display: flex; align-items: center; justify-content: center;
      color: #888; font-size: .9rem;
    }
    button {
      margin-top: 1.5rem; padding: .8rem 1.5rem; font-size: 1rem; font-weight: 600;
      background: #111; color: #fff; border: 0; border-radius: 8px; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .result { margin-top: 2rem; text-align: center; }
    .result img { max-width: 100%; max-height: 80vh; border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12); }
    .status { color: #555; margin-top: .5rem; min-height: 1.4em; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Style-Me · Virtual Try-On</h1>
  <p>Upload a photo of a person and a photo of a garment to preview the look.</p>

  <form id="tryon-form">
    <div class="grid">
      <div class="card">
        <label for="person">Person photo</label>
        <input id="person" name="person" type="file" accept="image/*" required />
        <div id="person-preview" class="preview">No image selected</div>
      </div>
      <div class="card">
        <label for="clothes">Garment photo</label>
        <input id="clothes" name="clothes" type="file" accept="image/*" required />
        <div id="clothes-preview" class="preview">No image selected</div>
      </div>
    </div>
    <button id="submit-btn" type="submit">Generate try-on</button>
    <div id="status" class="status"></div>
  </form>

  <div id="result" class="result"></div>

  <script>
    const personInput = document.getElementById('person');
    const clothesInput = document.getElementById('clothes');
    const personPreview = document.getElementById('person-preview');
    const clothesPreview = document.getElementById('clothes-preview');
    const form = document.getElementById('tryon-form');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const submitBtn = document.getElementById('submit-btn');

    function bindPreview(input, target) {
      input.addEventListener('change', () => {
        const file = input.files?.[0];
        if (!file) return;
        const url = URL.createObjectURL(file);
        target.style.backgroundImage = `url("${url}")`;
        target.textContent = '';
      });
    }
    bindPreview(personInput, personPreview);
    bindPreview(clothesInput, clothesPreview);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      resultEl.innerHTML = '';
      statusEl.classList.remove('error');
      statusEl.textContent = 'Uploading and generating… this can take 20–60 seconds.';
      submitBtn.disabled = true;

      const fd = new FormData();
      fd.append('person', personInput.files[0]);
      fd.append('clothes', clothesInput.files[0]);

      try {
        const res = await fetch('/api/tryon', { method: 'POST', body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Try-on failed');
        statusEl.textContent = 'Done!';
        const imgs = (data.outputs || []).map(src =>
          `<img src="${src}" alt="Try-on result" />`
        ).join('');
        resultEl.innerHTML = imgs || '<p>No output returned.</p>';
      } catch (err) {
        statusEl.classList.add('error');
        statusEl.textContent = `Error: ${err.message}`;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
