services:
  allinone:
    build:
      context: .
      dockerfile: Dockerfile.allinone
      args:
        NEXT_PUBLIC_TRYON_BACKEND_URL: ""
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ENV=production
      - FRONTEND_ORIGINS=http://localhost:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    profiles: ["split"]
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENV=production
      - FRONTEND_ORIGINS=http://localhost:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    profiles: ["split"]
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
